[package]
name = "relix-notify"
version = "0.1.0"
edition = "2021"
description = "Relix host-side notification relay (loopback only, no DB)"

[[bin]]
name = "relix-notify"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
